- id: D-019
  revision: 1
  supersedes: null
  concept: architecture.portability
  action: adapt
  selection: Portable exact declarations and verified local ownership migration
  rationale: Retain the narrow distributor; separate source selection from machine
    ownership, reject metadata drift, and recover interrupted writes with retained
    backups. No surveyed replacement has proved preservation/undo with lower burden.
  evidence:
  - tests/test_portability.py
  - Signals:3badfed8922e896e1c83d20c68654057487541ca:option-source-lineage:source-lineage-prov
  applicability: Codex project-local schema-2 pins and schema-1 installations.
  alternatives:
  - Preserve absolute-path public locks
  - Require manual edits to ownership
  - Correct the current adapter with checked rebind/export and recovery
  unknowns:
  - Concurrent hostile filesystem writers and power-loss durability are not guaranteed.
  validation:
  - Copied legacy edits refuse; portable apply and safe rebind preserve instructions;
    actual required version probes run.
  - A real owned subprocess was killed mid-application; recovery restores the original
    user instructions.
  - Independent imported-metadata findings corrected and covered by negative tests.
  rollback: Recover pending writes; undo unchanged files; use an earlier exact source
    snapshot when required.
  revisit_when: A real consumer needs unsupported provider distribution or fails recovery/portability
    invariants.
- id: D-020
  revision: 1
  supersedes: null
  concept: web.design
  action: adapt
  selection: Project brand intent and one selected primary design procedure
  rationale: Keep the already pinned instruction-only references. Guided critique suits new surfaces;
    a concise reference suits bounded changes within an established system. Two palette labels cannot
    represent project intent.
  evidence:
  - sources.lock.json:impeccable
  - sources.lock.json:anthropic
  - tests/test_loadouts.py
  applicability: Web selections only; guided default, lightweight explicit at a checkpoint; brand text
    remains subordinate to user/project authority.
  alternatives:
  - One heavy procedure for every web edit
  - Load both primary procedures
  - Select one procedure and keep browser acceptance constant
  unknowns:
  - No human evaluation or model-input measurement establishes superior design outcomes.
  validation:
  - Both closures retain selected source notices and browser checks; lightweight excludes guided resources.
  - Existing web fixture passes four widths, interactions and axe; screenshots inspected as builder judgment.
  rollback: Propose and review guided on refresh; apply only at a checkpoint; undo retains user edits.
  revisit_when: A real task shows insufficient guidance or conflicting project visual intent.
- id: D-021
  revision: 1
  supersedes: null
  concept: quality.strategy
  action: adopt
  selection: Exact Ruff semantic lint alongside retained contract and browser gates
  rationale: A bounded F/E9 trial found four unused imports and a dead local. Retain Ruby for authored
    Markdown/model/source rules, Python for exact schemas/ownership, and Node for Playwright; rewriting
    working responsibilities would add risk without a demonstrated benefit.
  evidence:
  - https://docs.astral.sh/ruff/linter/
  - ruff.toml
  - requirements-dev.txt
  - scripts/validate.rb
  - scripts/check_loadouts.py
  applicability: Development and CI only; no consumer tooling installation or format rewrite.
  alternatives:
  - Hand-maintain import/style checks
  - Port all validation to one runtime
  - Add the focused maintained linter and preserve distinct gates
  unknowns:
  - No measured development speedup; Python lint does not validate prose or model behavior.
  validation:
  - Pinned Ruff 0.16.10 F/E9 passes scripts/tests after the five trial findings were removed.
  - Ruff cache is excluded from authored-text validation; browser and contract suites remain separate.
  rollback: Remove the dev-only gate and exact dependency; retain all product tests.
  revisit_when: Duplicated validation or runtime burden demonstrates that a small consolidation preserves
    discriminating checks.
- id: D-004
  revision: 2
  supersedes: 1
  concept: context.loadouts
  action: adapt
  selection: Direct task reads; declarative pinned loadouts for recurring project selections
  rationale: The ordinary README probe installed standard and a separate use receipt although project
    instructions already determined the edit and checks. Keep direct reading first for settled tasks.
    Explanation and materialization share one composition owner so inherited routes and options agree.
  evidence:
  - core/context.md
  - core/prior-art.md
  - skills/context-loadout/SKILL.md
  - docs/loadouts.md
  - tests/test_consumer_path.py
  applicability: Ordinary task guidance and reusable Codex project selections; project authority wins.
  alternatives:
  - Install standard and require a receipt for every task
  - Add a classifier or installer wrapper
  - Use selective direct reads and correct the existing command interface
  unknowns:
  - A small disposable maintenance probe is diagnostic; it proves neither token savings nor human benefit.
  validation:
  - Baseline README task completed without a guidance-driven API decision or defect catch;
    installation and receipt lookup were additional steps.
  - Reproduced explain react-web omitting inherited web guidance and ignoring lightweight;
    shared composition now agrees with plan and retains one primary procedure.
  - Verify reports installation scope, executed runtime probes and project checks not run.
  - A fresh matched README probe used direct reads, preserved instructions/API/user notes,
    and passed the same tests without installing Context or writing a receipt; no API defect was caught.
  rollback: Keep earlier source pins; undo unchanged owned files. Direct reads leave no materialization.
  revisit_when: A real task needs durable selection or exposes missing guidance, misleading verification,
    or a direct-read path that cannot preserve project constraints.
- id: D-019
  revision: 2
  supersedes: 1
  concept: architecture.portability
  action: adapt
  selection: Portable declarations, verified ownership and native archive commit markers
  rationale: Retain the existing ownership, export/rebind and recovery mechanisms. A native source
    archive lacked its commit marker, and an export nested in a consumer repository inherited the
    consumer commit even with a source marker. Use Git export-subst and accept Git identity only
    when the source itself is the repository root.
  evidence:
  - https://git-scm.com/docs/gitattributes#_export_subst
  - sha256:dfbc18a97acbf42548b318bd6f86aa9ed347e97802c90678f134d3192f21c1b0
  - tests/test_consumer_path.py
  - tests/test_portability.py
  - docs/compatibility.md
  applicability: Exact Context checkouts and source archives; no automatic retrieval or publication.
  alternatives:
  - Manually normalize every extracted archive
  - Add a custom export wrapper
  - Use Git native substitution and a checked source-root boundary
  unknowns:
  - A marker identifies a claimed source commit, not authenticated provenance; resource hashes
    still pin selected bytes. Older or tree-only archives can retain unknown revision identity.
  - Concurrent hostile filesystem writers and power-loss durability remain outside the guarantee.
  validation:
  - Baseline archive reported exported-tree; a nested export reported the consumer commit.
  - Native archive expansion, source-root identity and unexpanded/missing marker fallback are checked.
  - Retained ownership, portability, instruction preservation and interruption recovery gates pass.
  rollback: Use earlier exact sources/pins; recover pending writes and undo unchanged files.
  revisit_when: A real supported source format loses its identity or authenticated producer provenance
    becomes necessary beyond the current trusted source boundary.
