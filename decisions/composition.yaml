schema_version: 1
decisions:
- id: D-018
  revision: 1
  supersedes: null
  concept: context.loadouts
  action: adapt
  selection: Explicit resource prerequisites with selected notices and source pins
  rationale: Ordinary Markdown links are navigation; their former recursive closure
    included unrelated instructions and directories. Keep the distributor and declare
    actual prerequisites. Compiled React advice replaces duplicated rule copies, with
    a local section route.
  evidence:
  - https://agentskills.io/specification
  - Signals:ee4aea154c461aaa8f9f0cbb770240c28c19dde7:claim-skills
  - Signals:ee4aea154c461aaa8f9f0cbb770240c28c19dde7:claim-react
  - tests/test_resources.py
  applicability: Codex project-local compositions; informational links never select
    dependencies.
  alternatives:
  - Retain implicit recursive links
  - Replace distributor with an unproved external installer
  - Correct the current narrow adapter and declare prerequisites
  unknowns:
  - Materialized bytes are measured; model token savings and human benefit are unmeasured.
  validation:
  - Regression reproduced unintended AGENTS inclusion before correction; selected
    dependencies, notices, casing, cycles and source integrity checked.
  - Independent review exposed missing routes; corrected React/design navigation retains
    applicable guidance.
  rollback: Use exact earlier source/pin; undo unchanged files before changing the
    composition.
  revisit_when: A real selected procedure cannot reach its instructions, or a maintained
    distributor proves lower total burden with preservation/undo.
