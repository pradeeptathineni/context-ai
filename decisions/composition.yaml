schema_version: 1
decisions:
- id: D-018
  revision: 2
  supersedes: 1
  concept: context.loadouts
  action: adapt
  selection: Explicit resource prerequisites with selected notices and source pins
  rationale: Retain the corrected explicit closure after peer primary-source dependency
    advice and independent challenge. The Bazel precedent supports declaring dependencies;
    local tests, rather than the precedent or older model paper, establish Context
    behavior.
  evidence:
  - https://agentskills.io/specification
  - Signals:ee4aea154c461aaa8f9f0cbb770240c28c19dde7:claim-skills
  - Signals:ee4aea154c461aaa8f9f0cbb770240c28c19dde7:claim-react
  - tests/test_resources.py
  - Signals:3badfed8922e896e1c83d20c68654057487541ca:option-selective-context:selective-context-bazel
  - sha256:21f90afb4a2e688f45d2e10dc2d06942b12d6b286c3c710ba93b104243d7eb34
  applicability: Codex project-local compositions; informational links never select
    dependencies.
  alternatives:
  - Retain implicit recursive links
  - Replace distributor with an unproved external installer
  - Correct the current narrow adapter and declare prerequisites
  unknowns:
  - Materialized bytes are measured; model token savings and human benefit are unmeasured.
  validation:
  - Regression reproduced unintended AGENTS inclusion before correction; selected
    dependencies, notices, casing, cycles and source integrity checked.
  - Independent review exposed missing routes; corrected React/design navigation retains
    applicable guidance.
  - Exact bootstrap pin was used for the closure correction and by Signals for public
    Corpus responsibility tracing.
  rollback: Use exact earlier source/pin; undo unchanged files before changing the
    composition.
  revisit_when: A real selected procedure cannot reach its instructions, or a maintained
    distributor proves lower total burden with preservation/undo.
- id: D-021
  revision: 1
  supersedes: null
  concept: quality.strategy
  action: adopt
  selection: Exact Ruff semantic lint alongside retained contract and browser gates
  rationale: A bounded F/E9 trial found four unused imports and a dead local. Retain Ruby for authored
    Markdown/model/source rules, Python for exact schemas/ownership, and Node for Playwright; rewriting
    working responsibilities would add risk without a demonstrated benefit.
  evidence:
  - https://docs.astral.sh/ruff/linter/
  - ruff.toml
  - requirements-dev.txt
  - scripts/validate.rb
  - scripts/check_loadouts.py
  applicability: Development and CI only; no consumer tooling installation or format rewrite.
  alternatives:
  - Hand-maintain import/style checks
  - Port all validation to one runtime
  - Add the focused maintained linter and preserve distinct gates
  unknowns:
  - No measured development speedup; Python lint does not validate prose or model behavior.
  validation:
  - Pinned Ruff 0.16.10 F/E9 passes scripts/tests after the five trial findings were removed.
  - Ruff cache is excluded from authored-text validation; browser and contract suites remain separate.
  rollback: Remove the dev-only gate and exact dependency; retain all product tests.
  revisit_when: Duplicated validation or runtime burden demonstrates that a small consolidation preserves
    discriminating checks.
- id: D-019
  revision: 3
  supersedes: 2
  concept: architecture.portability
  action: adapt
  selection: Portable source validation with destination-owned runtime discovery and recoverable delivery
  rationale: Retain the existing ownership, export/rebind and recovery mechanisms. A native source archive
    lacked its commit marker, and an export nested in a consumer repository inherited the consumer commit
    even with a source marker. Use Git export-subst and accept Git identity only when the source itself
    is the repository root. Portable-pin validation must compare reviewed declarations without consulting
    the validator working directory. Plan/apply discover required capabilities in the destination, and
    verify probes them there; imported availability cannot authorize delivery.
  evidence:
  - https://git-scm.com/docs/gitattributes#_export_subst
  - sha256:dfbc18a97acbf42548b318bd6f86aa9ed347e97802c90678f134d3192f21c1b0
  - tests/test_consumer_path.py
  - tests/test_portability.py
  - docs/compatibility.md
  applicability: Exact Context checkouts and source archives; no automatic retrieval or publication.
  alternatives:
  - Manually normalize every extracted archive
  - Add a custom export wrapper
  - Use Git native substitution and a checked source-root boundary
  - 'Reuse runtime resolution against the validator working directory (rejected: reproduced CI failure)'
  - Validate portable declarations without weakening destination requirements (selected)
  unknowns:
  - A marker identifies a claimed source commit, not authenticated provenance; resource hashes still pin
    selected bytes. Older or tree-only archives can retain unknown revision identity.
  - Concurrent hostile filesystem writers and power-loss durability remain outside the guarantee.
  validation:
  - Baseline archive reported exported-tree; a nested export reported the consumer commit.
  - Native archive expansion, source-root identity and unexpanded/missing marker fallback are checked.
  - Retained ownership, portability, instruction preservation and interruption recovery gates pass.
  - Reproduced declared Python validator without .venv; portable validation passes while missing destination
    runtime rejects before writes.
  rollback: Use earlier exact sources/pins; recover pending writes and undo unchanged files.
  revisit_when: A real supported source format loses its identity or authenticated producer provenance
    becomes necessary beyond the current trusted source boundary.

- id: D-020
  revision: 2
  supersedes: 1
  concept: web.design
  action: adapt
  selection: Data-declared primary design alternatives in the existing resolver
  rationale: Retain guided/lightweight meaning and current pins; finite aliases replace capability definitions
    without a per-option Python branch. Registry defaults and explicit project choices remain inspectable.
  evidence:
  - capabilities.yaml
  - tests/test_task_capabilities.py
  - sources.lock.json
  - evals/task-capabilities.md
  applicability: Web selections; task/project intent and one primary design procedure; no changed acceptance
    floor.
  alternatives:
  - Retain special-case design code
  - Install every upstream design suite
  - Declare finite aliases in the existing resolver
  unknowns:
  - Matched browser tasks tied on correctness; no human benefit or savings established.
  validation:
  - Legacy flags and generic options agree; selected closures/notices remain isolated.
  - Both web arms passed state/preservation browser evaluation.
  rollback: Use earlier exact source pins; undo unchanged owned resources; retain edited user work.
  revisit_when: A real unsupported option needs a different shape or guidance worsens task outcomes.
- id: D-010
  revision: 2
  supersedes: 1
  concept: quality.accessibility
  action: adapt
  selection: Project-local browser discovery followed by actual interaction and screenshot checks
  rationale: Retain Playwright/axe and project aesthetics. Static manifests and local CLI metadata make
    installed tools discoverable without downloads; browser launch and behavioral evidence remain separate.
    Exact keyboard assertions exposed a skip-destination defect.
  evidence:
  - domains/web/browser-verification.md
  - tests/test_task_capabilities.py
  - examples/web/verify.mjs
  - evals/task-capabilities.md
  applicability: Consumer web checks; supported nearest workspace boundaries and managed project environments
    only.
  alternatives:
  - Global CLI presence only
  - Require native browser/MCP or a new service
  - Reuse local Playwright or available native host tools with declared limits
  unknowns:
  - Native automatic skill activation and assistive-technology user validation remain unobserved.
  - External environments/stores and unsupported workspace glob forms need explicit inspection.
  validation:
  - Declared-only, installed-local, hostile-script/config and missing-browser negative controls.
  - Fresh review found cross-segment workspace overmatching; red/green nested-member and exclusion regression.
  - Four viewports/two palettes; note edit/retry, skip destination and next Tab focus, axe and inspected
    screenshots.
  rollback: Use earlier exact source pins; undo unchanged owned resources; retain edited user work.
  revisit_when: A supported consumer boundary is rejected unnecessarily, discovery grants false readiness
    or browser evidence misses a real failure.
- id: D-022
  revision: 1
  supersedes: null
  concept: quality.review
  action: adapt
  selection: Focused diagnosis and direct or bounded fresh artifact review
  rationale: Adapt proportionate Systematic Debugging and Google review criteria through current procedures/Agent
    Skills. Reuse existing orchestration only when host support and session authority justify a fresh
    native reader.
  evidence:
  - procedures/diagnose.md
  - procedures/review.md
  - procedures/review-fresh.md
  - docs/references.md
  - evals/task-capabilities.md
  applicability: Substantial failure diagnosis/review; existing project/user authority owns effects.
  alternatives:
  - Whole Superpowers suite
  - Reviewer personas or custom orchestrator
  - Short procedures plus existing testing/review/orchestration
  unknowns:
  - Both code arms fixed the protocol defect; no causal improvement or measured token/cost benefit.
  - Inherited model/effort IDs were not surfaced; explicit reads do not prove native activation.
  validation:
  - Actual red/green producer compatibility fix; supported replay and incompatible protocols graded separately.
  - One scoped fresh read-only review found a reproduced discovery boundary defect, corrected by the writer.
  rollback: Use earlier exact source pins; undo unchanged owned resources; retain edited user work.
  revisit_when: Repeated procedure friction or a missed consequential failure warrants simpler guidance
    or a targeted new check.

- id: D-004
  revision: 3
  supersedes: 2
  concept: context.loadouts
  action: adapt
  selection: Agent-led task equipping through context-loadout and a read-only explicit profile resolver
  rationale: HRR found that first-use routing, direct reads and recurring compositions already belong to
    context-loadout; standard owns consequential prior-art judgment. Extend that owner instead of adding
    a skill, semantic classifier or runtime. Reuse resource closure, options, tool discovery and model routes.
    Resolve only explicit agent choices; project/user instructions remain authoritative.
  evidence:
  - core/prior-art.md
  - skills/context-loadout/SKILL.md
  - docs/task-profiles.md
  - https://learn.chatgpt.com/docs/build-skills
  - https://agentskills.io/specification
  - https://github.com/obra/superpowers/blob/8ca22dba9a94f28898bbce59f2537ff4d87c747d/skills/writing-plans/SKILL.md
  applicability: Existing capable agents equipping software tasks; direct reads remain setup-free and
    materialization is optional for recurring selections. Packet selection is advice, never authority.
  alternatives:
  - Retain manual assembly by consumers familiar with Context internals
  - Make standard a second task-selection owner
  - Introduce a task skill, natural-language classifier or agent runtime
  - Adopt Superpowers planning and execution lifecycle wholesale
  - Adapt context-loadout and validate explicit choices with current deterministic machinery
  unknowns:
  - Native automatic skill selection and human first-use usefulness are not established by source
    documentation or deterministic profile tests.
  - Model recommendations require current host access checks; packets cannot observe session authority
    or native browser/subagent readiness.
  validation:
  - Before implementation, traced clean main 51de330 selection, explain, resolve, resources and discovery;
    task options/local tools already exist and need no replacement.
  - Primary skill documentation supports model-led selection and on-demand resources. Superpowers
    planning supplies explicit constraints and verification but its mandatory handoff/lifecycle exceeds
    this library's task-equipping responsibility.
  - Six builder-authored task profiles and a no-extra-context control resolve through the CLI;
    contract tests cover literal route precedence, stage slicing, unsafe/unknown choices, opposing
    procedures, fresh-review consistency and execution/write tripwires.
  - Actual review/validation use on this change resolved eleven guidance resources with required
    PACT and one-agent advice, without materialization or active-model changes; evidence and limits
    are recorded in evals/task-profiles.md.
  rollback: Use the earlier exact source/pins. Profile resolution writes no consumer files; existing
    installation, refresh and undo remain the materialization contract.
  revisit_when: Real first-use tasks cannot select a sufficient small profile, or a maintained native
    resolver supplies the same explicit validation with less burden.

- id: D-024
  revision: 2
  supersedes: 1
  concept: context.capability_selection
  action: build
  selection: One validated concern owner; current decisions in the tree, predecessors in Git
  rationale: The concern map prevents competing active guidance and duplicate native skills. Exact source
    commits already reproduce earlier pins, decisions and superseded guidance; an additional archive copy
    has no replay or migration consumer. Retain the map and remove the duplicate archive and predecessor
    records from the current tree.
  evidence:
  - ownership.yaml
  - tests/test_ownership.py
  - docs/compatibility.md
  applicability: All loadouts, capabilities and skills in this library.
  alternatives:
  - Implicit ownership
  - Validated ownership with duplicate archive and predecessor records
  - Validated ownership with exact history in Git (selected)
  unknowns:
  - The map records library ownership; it cannot observe what a consumer's native host has installed beyond
    project-local discovery.
  validation:
  - Validator rejects a concern with two owners, an active route to an archived file, and any loadout
    or capability resource not covered by a concern.
  rollback: Use the earlier exact source commit for historical pins; restore removed guidance from Git
    if an actual migration needs it.
  revisit_when: A concern needs two owners in different contexts, or the map drifts from actual loadouts.

- id: D-026
  revision: 1
  supersedes: null
  concept: context.retrieval
  action: adopt
  selection: Optional Context7 lookup with exact-version check and installed-source or official-doc
    fallback
  rationale: A live Context7 query for urllib3 Retry returned relevant main-branch documentation with
    source links, but the exact installed version (2.8.0) was refused as version_not_found (only
    1.26.20 indexed). The procedure's version check caught the mismatch; the installed signature
    confirmed the documented parameters. Context7 helps discovery but cannot be the version authority.
  evidence:
  - procedures/current-docs.md
  - https://github.com/upstash/context7
  - evals/context-efficiency-trial.md
  applicability: Version-sensitive library or API questions in a consumer project.
  alternatives:
  - Require Context7 for every docs question
  - Official documentation only
  - Optional Context7 plus exact-version verification and fallback
  unknowns:
  - Context7 index coverage varies by library; the hosted backend is third-party and not self-hostable.
  validation:
  - Live search and context calls on 2026-10-07; version-pinned call returned HTTP 404
    version_not_found; installed urllib3 2.8.0 Retry signature inspected.
  rollback: Remove the optional capability; the procedure already works without it.
  revisit_when: Context7 indexes exact versions for the project's dependencies, or its terms change.

- id: D-027
  revision: 1
  supersedes: null
  concept: context.sync
  action: retain
  selection: Keep Context's thin native routers and managed blocks for Codex and Claude Code; Rulesync
    not adopted as the rendering backend
  rationale: Native host facilities came first. Claude Code reads AGENTS.md natively and discovers
    .claude/skills; Codex discovers .agents/skills. Rulesync 27.0.0 direct conversion was idempotent but
    overwrote edited and unowned destinations, did not copy the guidance closure and left foreign
    Claude outputs after Context undo. Replacing the few rendering lines would add a Node runtime and a
    staging layer without removing selection, pinning, preview, recovery or undo.
  evidence:
  - https://github.com/dyoshikawa/rulesync/tree/0e60051de7e7d8793d92f75a7b15dd3e87e33a18
  - https://code.claude.com/docs/en/memory
  - https://code.claude.com/docs/en/skills
  - https://learn.chatgpt.com/docs/import
  - providers/anthropic/claude-code.md
  - tests/test_hosts.py
  applicability: Rendering selected routers and instruction blocks into AGENTS.md, CLAUDE.md,
    .agents/skills and .claude/skills of a consumer project.
  alternatives:
  - Rulesync generation or direct conversion behind Context preview
  - Native Codex /import of Claude configuration
  - Duplicate CLAUDE.md content for every project
  - Native-first routing with Context-owned thin routers
  unknowns:
  - Native Codex /import was not exercised (it needs an idle interactive session); Claude Skill
    invocation was not observed because the standalone CLI is not signed in.
  validation:
  - Independent parallel Codex session ran Rulesync v27.0.0 (MIT, npm artifact pinned, install hooks
    disabled) in disposable consumers against the C1 lifecycle; its delivery decision and runnable
    scripts are in the local planning folder.
  - All loadouts pass the lifecycle suite for codex, claude and both.
  rollback: Not applicable; nothing from Rulesync was installed.
  revisit_when: Context needs a host format or metadata conversion beyond thin routers that Rulesync
    supports with an in-memory boundary, preserved closure and lifecycle parity.

- id: D-028
  revision: 1
  supersedes: null
  concept: research.decision
  action: trial
  selection: For a Markdown-in-Git reading-notes project that also opens notes in Neoma, deliver Neoma's
    pinned Markdown compatibility documentation through an opt-in procedure; Neoma stays a reader and
    plain Markdown in Git stays the owner
  rationale: A real post-reset Signals export nominated Neoma from one supported upstream claim. Context
    inspected the pinned revision (AGPL-3.0-or-later, no install hooks, Markdown canonical) and ran the
    upstream import/export and link tests. A consumer agent using only the delivered procedure wrote three
    notes that Neoma's own code parsed with no broken links and a byte-identical ZIP round trip; the
    unchanged baseline failed the same check. The other six Signals candidates address different
    capabilities and were rejected for this need. A producer score or action decided nothing.
  evidence:
  - https://github.com/infinitumio/neoma/tree/18c63fbd72e40f7cefad22f189b6ecde79e61716
  - sources.lock.json
  - procedures/portable-notes.md
  - evals/pair-exercise.md
  applicability: Projects that keep research notes as Markdown in Git and have chosen Neoma as a reader;
    opt-in with --with context-portable-notes, never a default.
  alternatives:
  - Plain Markdown and Git only (status quo)
  - Install the Neoma application into the consumer
  - Adopt one of the other Signals candidates (Zotero MCP, Local Deep Research, Zotero, Gemini
    Notebook, GPT Researcher, Open Notebook)
  - Opt-in documentation-only procedure over the pinned compatibility reference
  unknowns:
  - One agent run and one builder-designed task; Neoma's browser UI, folder vaults and citation handling
    were not exercised; human usefulness is unmeasured.
  validation:
  - Neoma-based external check failed on the baseline consumer and passed after the agent task (5 notes,
    0 broken links, identical re-import); undo preserved user edits and the notes still passed.
  rollback: undo the consumer selection; drop the opt-in capability and the pinned documentation.
  revisit_when: Neoma's compatibility documentation changes materially, its license changes, or the
    consumer stops using Neoma.

- id: D-023
  revision: 2
  supersedes: 1
  concept: research.prior_art
  action: retain
  selection: Native-sufficient for ordinary covered work; pinned essentials and individual upstream
    procedures remain explicit selections for consequential decisions or regression risk
  rationale: Earlier consumers reached the same correct outcomes with higher consumption when
    essentials was selected. A required Context decision record cannot establish task advantage.
    Empty selection now operates without task guidance, probes or prior-art obligations; focused
    resource delivery preserves upstream bytes, license and safe lifecycle management.
  evidence:
  - evals/essentials-trial.md
  - evals/selective-value.md
  - tests/test_native_output.py
  - docs/loadouts.md
  applicability: Setup selects only needed recurring resources; ordinary settled tasks stay native.
    Existing project and user instructions retain authority over this selection advice.
  alternatives:
  - Require essentials and a decision record on every feature task
  - Read a relevant pinned upstream directly with native tools
  - Deliver only a focused resource through Context ownership and both host routers
  unknowns:
  - Human usefulness and population-level productivity are unassessed; small operational comparisons
    do not establish general savings or a served-model identity.
  validation:
  - Frozen native/direct-upstream/Context CSV arms reach the same external correctness outcome;
    ordinary typo controls avoid TDD guidance, including the native-sufficient delivered selection.
  - The unchanged nine loadouts and selected original source bytes remain available; native and
    Context lifecycle paths preserve edited helpers and user instructions.
  rollback: Use an earlier exact source/pin or explicitly select essentials; no installed project
    is automatically refreshed or removed.
  revisit_when: A consequential task shows a concrete avoided defect or useful coverage improvement
    that earns the extra guidance and survives a fair native/direct-upstream comparison.

- id: D-025
  revision: 2
  supersedes: 1
  concept: context.compression
  action: adapt
  selection: Native saved logs and bounded search remain incumbent; opt-in context-output supplies
    capture-once, durable exit status and numbered retrieval before exposure
  rationale: Previous agents read the whole verbose log before guidance ran. A short root routing
    cue now names the real operation before reading selected modules. The stdlib helper retains exact
    merged raw bytes and child status separately from a partial view. Scoped RTK shell/test trials
    preserve status but omit causes in compact output, so raw recall is required and RTK is optional.
    Native file tools bypass shell filters and need their own explicit bounds.
  evidence:
  - evals/selective-value.md
  - evals/context-efficiency-trial.md
  - procedures/output.md
  - scripts/context_output.py
  - tests/test_native_output.py
  - https://github.com/rtk-ai/rtk/tree/e001f773f80b22b7dc4c7a79521b30e35aaef026
  applicability: Opt-in consumers with verbose commands/logs requiring recoverable causal evidence.
    No hook, server, dependency, model or runtime is enabled by selection.
  alternatives:
  - Native redirection plus bounded grep/range reads
  - Explicit project-local RTK with reviewed source and raw recall
  - Existing scoped context-mode, Headroom and Graphify trials
  unknowns:
  - No universal interception, long-session advantage or human benefit is demonstrated; built-in
    Read/Grep/Glob remain outside shell filtering, and line suffixes require native range recovery.
  validation:
  - Consumer traces demonstrate guide use and bounded causal retrieval before full log exposure;
    a strong native workflow also recovers the cause without exposing the whole source.
  - Independent checks cover binary raw bytes, nonzero status, signal status, failed startup,
    view-render failure, existing-path refusal, giant lines and edited-file-safe undo.
  rollback: Undo unchanged owned resources; preserve private raw logs and adjacent status receipts.
    Use native bounded capture/search or the earlier exact source for existing pins.
  revisit_when: A real unstructured workload defeats simple retrieval, or a project-local alternative
    preserves more important evidence with lower complete-task consumption.

- id: D-029
  revision: 1
  supersedes: null
  concept: context.compression
  action: adapt
  selection: Opt-in full or Python AST structural source inside the existing source-bound task-pack lifecycle
  rationale: The existing repository map supplies ranked, safe tracked candidates but its excerpt window can
    omit a declaration's context or a complete source file. Extend that owner with exact full source and a
    Python-only lossy reading view. Use the standard library AST rather than adopting Repomix's Tree-sitter
    runtime; preserve exact spans and source identity so exports can replay deterministically. Unsupported or
    unsafe cases use exact bounded source or an explicit omission. Guidance and notices remain complete.
  evidence:
  - scripts/context_pack.py
  - scripts/repo_map.py
  - tests/test_context_pack.py
  - docs/context-packs.md
  - docs/context-pack-provenance.md
  - https://github.com/yamadashy/repomix/tree/e696384d062f08f0246ffd2580d5a206484fc0a4/src/core/treeSitter
  applicability: Opt-in task packs for tracked source inspection; structural output is not executable,
    behavior-equivalent source or proof of model-token savings.
  alternatives:
  - Existing exact ranked excerpt
  - Full source only
  - Adopt pinned Tree-sitter compression and its runtime dependencies
  - Standard-library Python structure with exact full fallback
  unknowns:
  - No human usefulness or served-model outcome is established; Python is the only structural language.
  validation:
  - Synthetic exact checks cover full bytes, CRLF/Unicode/no-final-newline, imports, module assignments,
    decorators, multiline async signatures, docstrings, license notice, discontiguous span hashes, omissions,
    unsupported/malformed/deep/non-reducing/notice fallback and body-only source drift.
  - Reopened previews replay source-bound representations; complete text/JSON formats remain within the
    requested byte budget.
  rollback: Keep the existing excerpt default; remove only the opt-in representation choice and its replay
    metadata if a representation cannot preserve source identity or safe export.
  revisit_when: A real Python task shows structure omits a necessary decision fact, or a maintained upstream
    adds a substantially better bounded interface without unacceptable runtime or provenance cost.

- id: D-030
  revision: 1
  supersedes: null
  concept: agents.handoff
  action: build
  selection: A local Context service freezes explicitly opened owner records, unchanged selected Context
    guidance and separate user-authored synthesis into a bounded fresh-session export.
  rationale: A resumed agent needs the exact original decisions and unresolved questions with their owner,
    instance, epoch, digest, observation and export time, not a summary that can erase provenance. Signals'
    `knowledge/record` envelope supplies frozen owner identities; Context owns only the local reconstruction
    and uses its existing private source-bound store and guidance resolver. The export has no execution
    history or acceptance state and never launches or delivers a session.
  evidence:
  - scripts/session_handoff.py
  - tests/test_session_handoff.py
  - docs/session-handoff.md
  - docs/context-pack-provenance.md
  - https://github.com/earendil-works/pi/tree/8a2ebd38549c3521a02db0e5d758a24320e97f94/packages/coding-agent/src/core/session-manager.ts
  applicability: Operators explicitly selecting frozen Signals, Planning or Principles records for a new
    native session. Remote owner freshness remains unverified and no Deep consumer is included here.
  alternatives:
  - Re-read owner records and authored handoff directly in the new session
  - Export only references and reopen each record manually
  - Resume a native session with its provider-specific history and compaction semantics
  unknowns:
  - No native consumer, provider delivery, model adherence or task-quality benefit has been established.
    Owner snapshots are caller-supplied and not cryptographic attestations.
  validation:
  - Offline synthetic journey preserves duplicate IDs across distinct stores, exact content/qualification,
    unanswered work, dated or unknown freshness, hostile historical text boundaries and selected guidance.
  - Restart, source drift, altered project root, idempotency conflict, stale revision, digest mismatch,
    forged owner, duplicate identity, symlink, capacity, output isolation and whole-record budget omission
    checks pass.
  rollback: Remove the standalone service and documentation; Context pack defaults and existing task packs
    remain unchanged.
  revisit_when: A real consumer needs signed owner attestations, a native session lifecycle or a different
    source-authoritative way to reopen selected records.
