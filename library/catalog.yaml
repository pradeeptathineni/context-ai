- id: matt-pocock-code-review
  name: Matt Pocock focused code review
  purpose: Review changes since a fixed point on separate Standards and Spec axes with a full code-smell baseline.
  concern: code-review
  delivery:
    kind: capability
    id: context-code-review
  upstream:
    url: https://github.com/mattpocock/skills
    revision: f3fc5632f401156837ee3872f14fe33ccf1024ea
    license: MIT
    license_source: sourced/mattpocock/LICENSE
  domains:
  - software
  requirements:
  - A fixed point (commit, branch or merge-base) or named change
  - Git history readable by the reviewer
  permissions:
  - Review-only unless the task authorizes corrections; no tracker setup or sub-agents are activated.
  references:
  - procedures/code-review.md
  - sourced/mattpocock/code-review/instruction.md
  - sources.lock.json
  status: experimental
  limits:
  - Not selected alongside context-review for the same concern.
  - Upstream prose assumes parallel sub-agents and a tracker setup skill; the adapter makes both non-defaults.
  - No complexity axis or explicit caller-tracing step.
  assessments:
  - scope: 'Source-supported: pinned upstream skill bytes and license inspected; equal at 5beb35b.'
    evidence:
    - sourced/mattpocock/code-review/instruction.md 09eb147f793e4647949edd32dbad278f0554dfb56e0d46b699cd4c2c55bf0357
    strengths:
    - Concrete fixed-point diff procedure, standards discovery and a fixed two-heading report.
    weaknesses:
    - Upstream describes its intended behavior; no review outcome is established by source inspection.
    checked_ref: 5beb35b040e3de97e54fa9e386d7e42d15c295c2
    grade: null
  - scope: 'Locally tested: Agent Skills package validation, --library-profile delivery, verify, refresh and
      undo in a disposable consumer.'
    evidence:
    - tests/test_skill_validation.py, journey cases added with this option on the checked validator commit
    strengths:
    - Pinned entry validates as package code-review; router validates as context-code-review.
    weaknesses:
    - Native discovery, reading and review usefulness had not been observed at this checked ref; see the later paired observation below.
    checked_ref: 1413755d02c8bdad3939ee27d43d1a7dcb58db35
    grade: null
  - scope: 'Native pair observed 2026-10-21: one read-only baseline and one equipped review of the same authored diff.'
    evidence:
    - 'Coordinator COMPARISON.json SHA-256 e559c4d643efbe05f085ccfb48b87ddaa13aa0bdf49a73d9a11050f69c57b817; same prompt, model and effort.'
    - 'Both found the stale price lookup in shop/receipt.py:9 and preserved integer-cent behavior; equipped review read its router, adapter and pinned instruction.'
    strengths:
    - Native equipment consumption and a useful defect finding were observed.
    weaknesses:
    - No quality uplift was measured in this single case because the native baseline found the same defect; this does not judge other tasks or Context overall. The installed TDD option was not invoked.
    checked_ref: 0042b0c6b1cc4b35ea8fd14f2916e6a02331dc83
    grade: null
