purpose: Equip AI-assisted Signals development with focused output handling and source-evidence review
  while Signals owns research and project opportunities.
environment:
  language: Node.js >=24.19.0 <25 / TypeScript
  package_manager: npm >=12.1.0 <13; exact package lock
  checks:
  - npm run verify
  snapshot_scope: Public source inspection at the recorded revision; peer greenfield owner may supersede
    it.
priorities:
- Preserve immutable evidence, private research state and historical policy during AI-assisted changes.
- Use focused guidance at the relevant engineering action; no candidate execution by Signals.
policy:
  trials:
  - context-output
  - context-tdd
  - hypothesis
  updates:
  - context-output
  - context-tdd
  - hypothesis
  schedule: false
selections:
- option: native
  reason: Signals already owns native research, evidence validation, its CLI and Corpus.
  concern: ordinary-work
- option: context-output
  reason: Give the reciprocal consumer one narrow output capability, invoked explicitly before its command.
  concern: output-handling
- option: research-evidence
  reason: Use at source assessment and interchange boundaries while preserving producer mode and missing
    revisions.
  concern: research
