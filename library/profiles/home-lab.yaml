purpose: Operate a private optional Mac/Linux lab and prove safe recovery and experiments.
environment:
  language: Python >=3.12
  runtime: Mac host with Lima Linux VM; runtime state not probed
  checks:
  - python -m pytest
  - python -m ruff check .
  - ./bin/labctl validate
  snapshot_scope: Committed public HEAD only; uncommitted changes and private runtime data were not inspected.
priorities:
- Private services and explicit secrets/data boundaries.
- Recoverability before more services.
- Kubernetes remains deliberately deferred.
policy:
  trials: []
  updates: []
  schedule: false
selections:
- option: native
  reason: The existing labctl, tests and operations own service and recovery actions.
  concern: ordinary-work
- option: context-output
  reason: Opt in before verbose validate/test commands to retain failures without repeating service actions.
  concern: output-handling
suggestions:
- area: Backup / recovery
  opportunity: Close the independent-backup-destination gap using the existing restore workflow.
  option: native
  why: README and recovery documentation explicitly distinguish a same-Mac fixture proof from resilient
    backup.
  evidence:
  - README.md
  - docs/recovery.md
  limitations:
  - No destination, credentials or current backup runtime was inspected.
  - The checkout has uncommitted changes beyond this snapshot.
  next_action: Choose an explicitly authorized independent destination, then use the existing backup check
    and fixture restore-test to record checksum recovery; keep service quiesce/export requirements.
  status: suggested
  checked_ref: 7768131dc21f5a3bb1e46aeebce16fe8972cc887
  date: '2026-10-08'
- area: Operational diagnostics
  opportunity: Retain validation output once before retrieving the failing cause.
  option: context-output
  why: The project has explicit validate/test commands; recoverable logs can avoid rerunning potentially
    stateful operations.
  evidence:
  - Makefile
  - pyproject.toml
  - docs/greenfield-prior-art.md
  limitations:
  - No large-output failure or speed benefit was measured for home-lab.
  - Native reads bypass the explicit wrapper.
  next_action: In a disposable approved consumer, compare native redirect/search with context-output on
    an existing validation command before changing the operational route.
  status: conditional
  checked_ref: 7768131dc21f5a3bb1e46aeebce16fe8972cc887
  date: '2026-10-08'
