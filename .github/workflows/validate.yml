name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact contract dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate repository and loadouts
        run: |
          ruby scripts/validate.rb
          python scripts/check_loadouts.py
          ruby scripts/lookup.rb context.skills --provider openai --product codex > /dev/null
      - name: Test product contracts
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser runtime
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:web
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-evidence
          path: .examples-output/web-evidence/
