schema_version: 1
capabilities:
  python-runtime:
    kind: command
    command: python3
    boundary: Python 3.10+ and requirements.txt; no installer side effects.
  git:
    kind: command
    command: git
    boundary: Read-only discovery; mutation needs task authority.
  context-web-design:
    kind: resource
    path: procedures/web-design.md
    description: Use Impeccable instruction-only design procedure for frontend work.
    files:
    - sourced/impeccable/design/LICENSE
    - sourced/impeccable/design/instruction.md
    - sourced/impeccable/design/NOTICE.md
    boundary: No binaries/hooks; one primary procedure; brand and project authority
      override tastes.
  context-react-review:
    kind: resource
    path: procedures/react-review.md
    description: Read targeted Vercel React rules when the actual project uses React.
    files:
    - sourced/vercel/react/compiled-guide.md
    - sourced/vercel/react/upstream-README.md
    boundary: Match framework/version; no forced Next or Vercel hosting.
  context-web-audit:
    kind: resource
    path: sourced/vercel/web/instruction.md
    description: Audit web interaction with Vercel guidance and WCAG.
    files:
    - sourced/vercel/web/upstream-README.md
    boundary: Advisory audit; no silent fetch or pin changes.
  node:
    kind: command
    command: node
    boundary: Project runtime version must be checked at use.
  browser:
    kind: command
    command: playwright
    boundary: Optional CLI discovery only. Full Playwright/axe/browser availability
      must be established by the recipe in the consumer project; local Node dependencies
      may provide it without a global command.
  terraform:
    kind: command
    command: terraform
    boundary: Optional for context-only planning; required before Terraform validation.
  aws-cli:
    kind: command
    command: aws
    boundary: Optional for source planning; no apply/deployment authorization.
  context-pact-hrr:
    kind: resource
    path: skills/pact-hrr/SKILL.md
    description: Reconsider a consequential responsibility using prior art and actual
      use.
    boundary: Instruction-only procedure; existing task authority governs effects.
