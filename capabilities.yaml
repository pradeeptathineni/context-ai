schema_version: 1
capabilities:
  python-runtime:
    kind: command
    command: python3
    boundary: Python 3.10+ and requirements.txt; no installer side effects.
    resolver: python
  git:
    kind: command
    command: git
    boundary: Read-only discovery; mutation needs task authority.
  context-web-design:
    kind: resource
    path: procedures/web-design.md
    description: Use Impeccable instruction-only design procedure for frontend work.
    files:
    - sourced/impeccable/design/LICENSE
    - sourced/impeccable/design/instruction.md
    - sourced/impeccable/design/NOTICE.md
    boundary: No binaries/hooks; one primary procedure; brand and project authority
      override tastes.
  context-react-review:
    kind: resource
    path: procedures/react-review.md
    description: Read targeted Vercel React rules when the actual project uses React.
    files:
    - sourced/vercel/react/compiled-guide.md
    - sourced/vercel/react/upstream-README.md
    boundary: Match framework/version; no forced Next or Vercel hosting.
  context-web-audit:
    kind: resource
    path: sourced/vercel/web/instruction.md
    description: Audit web interaction with Vercel guidance and WCAG.
    files:
    - sourced/vercel/web/upstream-README.md
    boundary: Advisory audit; no silent fetch or pin changes.
  node:
    kind: command
    command: node
    boundary: Project runtime version must be checked at use.
    resolver: node
  browser:
    kind: command
    command: playwright
    boundary: Static declaration/local package/PATH discovery. Browser binaries, launch,
      compatibility and tests remain untested until explicit project checks.
    resolver: playwright
  terraform:
    kind: command
    command: terraform
    boundary: Optional for context-only planning; required before Terraform validation.
  aws-cli:
    kind: command
    command: aws
    boundary: Optional for source planning; no apply/deployment authorization.
  context-pact-hrr:
    kind: resource
    path: skills/pact-hrr/SKILL.md
    description: Reconsider a consequential responsibility using prior art and actual
      use.
    boundary: Instruction-only procedure; existing task authority governs effects.
  context-web-design-guided:
    kind: resource
    path: procedures/web-design.md
    description: Use Impeccable instruction-only design procedure for frontend work.
    files:
    - sourced/impeccable/design/LICENSE
    - sourced/impeccable/design/instruction.md
    - sourced/impeccable/design/NOTICE.md
    boundary: No binaries/hooks; one primary procedure; brand and project authority
      override tastes.
  context-web-design-lightweight:
    kind: resource
    path: procedures/web-design-lightweight.md
    description: Use concise frontend design guidance for bounded existing-surface
      changes.
    files:
    - sourced/anthropic/design/instruction.md
    - sourced/anthropic/design/LICENSE.txt
    boundary: No binaries/hooks; one primary procedure; brand and project authority
      override tastes.
  context-diagnose:
    kind: resource
    path: procedures/diagnose.md
    description: Diagnose and fix a command, integration or observable behavior failure.
      Skip routine edits without a failure.
    boundary: Instructions only; project commands and existing authority govern execution.
  context-review:
    kind: resource
    path: procedures/review.md
    description: Review a consequential diff for correctness, compatibility and discriminating
      tests. Distinguish review-only authority from corrections.
    boundary: Instructions only; a review selection grants no delegation or write
      authority.
  context-review-direct:
    kind: resource
    path: procedures/review.md
    description: Review a consequential diff for correctness, compatibility and discriminating
      tests. Distinguish review-only authority from corrections.
    boundary: Instructions only; a review selection grants no delegation or write
      authority.
  context-review-fresh:
    kind: resource
    path: procedures/review-fresh.md
    description: Review a consequential diff with one bounded fresh native reader
      when host support and session authority permit.
    boundary: Instructions only; a review selection grants no delegation or write
      authority.
  package-manager:
    kind: command
    command: npm
    resolver: package-manager
    boundary: Declared manager/lockfile and PATH are advisory; scripts are unexecuted
      candidates. No network resolution or package scripts in discovery/probes.
options:
  brand:
    description: Preserve the consuming project visual intent.
    type: text
    max_length: 2000
  design_procedure:
    description: One primary web design procedure; same acceptance floor.
    default: guided
    alternatives:
      guided:
        description: New surface or substantial design/critique.
        aliases:
          context-web-design: context-web-design-guided
      lightweight:
        description: Bounded correction within an established visual identity.
        aliases:
          context-web-design: context-web-design-lightweight
  review_mode:
    description: Direct artifact review or one bounded fresh native reader.
    default: direct
    alternatives:
      direct:
        description: One agent reviews actual artifacts; no delegation needed.
        aliases:
          context-review: context-review-direct
      fresh:
        description: One fresh native read-only reviewer, only with host support and
          existing authority; no silent fallback.
        aliases:
          context-review: context-review-fresh
